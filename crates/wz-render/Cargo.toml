[package]
name = "wz-render"
description = "wgpu 2D renderer: batcher, atlas, camera, lights, WGSL shaders"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
wz-error.workspace = true
wz-pool.workspace = true
wgpu.workspace = true
glam.workspace = true
bytemuck.workspace = true
pollster.workspace = true
# naga 는 dev-dependency 가 아니라 **실제 의존성**이다.
# `shader::inter_stage_layout()` 이 wgsl-in 프론트엔드로 IR 을 파서
# inter-stage 레이아웃을 뽑는다 — 정점↔픽셀 호환성을 빌드/테스트 시점에
# 기계적으로 검증하려면 정점 셰이더를 파는 코드가 프로덕션 경로에 있어야 한다.
naga.workspace = true

[lints.rust]
unsafe_code = "deny"
