[package]
name = "wz-gui"
description = "WzComparerR2 Rust 데스크톱 GUI (Phase 8 PoC)"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/nanpuhaha/WzComparerR2-Rust"
authors = ["Seo, Jang-won <nanpuhaha@gmail.com>"]
publish = false

# 이 크레이트는 워크스페이스 밖의 독립 패키지다. `cargo test --workspace` 에
# 섞이지 않게 하여 GUI 빌드가 헤드리스 CI 게이트를 막지 않도록 한다.
# (docs/gui-architecture.md §3.4, §9.4)
[workspace]

[[bin]]
name = "wz-gui"
path = "src/main.rs"

[dependencies]
wz-core = { path = "../../crates/wz-core" }
wz-image = { path = "../../crates/wz-image" }
wz-render = { path = "../../crates/wz-render" }
wz-db = { path = "../../crates/wz-db" }
wz-avatar = { path = "../../crates/wz-avatar" }
eframe = { version = "0.37", features = ["wgpu"] }
egui = "0.37"
wgpu = "30"
bytemuck = "1"

[lints.rust]
unsafe_code = "deny"
